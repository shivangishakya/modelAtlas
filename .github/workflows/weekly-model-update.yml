name: Weekly Model Atlas update

on:
  schedule:
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Commit and deploy verified model and domain changes
        required: true
        default: false
        type: boolean
      smoke_test:
        description: Check Gemini access only; do not research, edit, or deploy
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: weekly-model-atlas-update
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Verify Gemini model access
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run a single-request Gemini health check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-model-catalog.mjs --smoke

  research:
    name: Research and validate model and domain updates
    if: github.event_name == 'schedule' || inputs.smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.scope.outputs.has_changes }}

    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Fetch official releases and run the single-request Gemini agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-model-catalog.mjs

      - name: Enforce the agent file boundary
        id: scope
        shell: bash
        run: |-
          set -euo pipefail
          git diff --name-only > /tmp/model-atlas-changed-files
          git ls-files --others --exclude-standard >> /tmp/model-atlas-changed-files
          sort -u -o /tmp/model-atlas-changed-files /tmp/model-atlas-changed-files

          if [[ ! -s /tmp/model-atlas-changed-files ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No verified model or Domain Map changes were produced."
            exit 0
          fi

          if grep -Ev '^app/model-atlas/(catalog|domains)\.ts$' /tmp/model-atlas-changed-files; then
            echo "Gemini attempted to modify a file outside the reviewed data boundary." >&2
            exit 1
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Validated changed-file boundary for Model Atlas data."

      - name: Install dependencies
        if: steps.scope.outputs.has_changes == 'true'
        run: npm ci

      - name: Format the candidate data
        if: steps.scope.outputs.has_changes == 'true'
        run: npx prettier --write app/model-atlas/catalog.ts app/model-atlas/domains.ts

      - name: Validate literal catalog and Domain Map data
        if: steps.scope.outputs.has_changes == 'true'
        run: npm run atlas:validate

      - name: Run complete project checks
        if: steps.scope.outputs.has_changes == 'true'
        run: |-
          npm run format:check
          npm run lint
          npm test
          git diff --check

      - name: Create the validated Model Atlas patch
        if: steps.scope.outputs.has_changes == 'true'
        run: git diff --binary -- app/model-atlas/catalog.ts app/model-atlas/domains.ts > model-atlas.patch

      - name: Preserve the validated patch
        if: steps.scope.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-model-atlas-patch
          path: model-atlas.patch
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Commit and deploy validated updates
    needs: research
    if: >-
      needs.research.outputs.has_changes == 'true' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Download the validated patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-model-atlas-patch
          path: ${{ runner.temp }}/model-atlas-patch

      - name: Apply the validated patch
        run: |-
          git apply --check "$RUNNER_TEMP/model-atlas-patch/model-atlas.patch"
          git apply "$RUNNER_TEMP/model-atlas-patch/model-atlas.patch"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Revalidate the isolated data change
        run: |-
          npm run atlas:validate
          npm run format:check
          npm run lint
          npm test
          git diff --check

      - name: Commit and push as Shivangi
        run: |-
          git config user.name "Shivangi Shakya"
          git config user.email "shivangi11061993@gmail.com"
          git add app/model-atlas/catalog.ts app/model-atlas/domains.ts
          git commit -m "chore: refresh AI model and domain data"
          git push origin HEAD:main

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.8.0

      - name: Pull Vercel production settings
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the Vercel artifact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify the public website and advisor
        shell: bash
        run: |-
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://model-atlas-mu.vercel.app/ > /dev/null

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 70 \
              https://model-atlas-mu.vercel.app/api/advisor \
              -H "content-type: application/json" \
              --data '{"description":"Choose an AI model for reviewing long technical documents and producing a cited engineering summary.","priorities":["long"]}' \
              --output /tmp/model-atlas-advisor.json && \
              jq -e '.analysisModel == "Gemini 3.6 Flash" and (.recommendations | length == 3)' /tmp/model-atlas-advisor.json > /dev/null; then
              echo "Production verification passed."
              exit 0
            fi
            sleep 10
          done

          echo "Production advisor verification failed." >&2
          exit 1
